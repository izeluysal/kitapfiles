<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kitap & Okuma Takip Portalı{% endblock %}</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Özel CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-navy sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-book-fill me-2"></i>Kitap Takip Portalı
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-sage-green ms-2" id="addBookBtn">
                            <i class="bi bi-plus-lg me-2"></i>Yeni Kitap Ekle
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Modal Container (Add/Edit Book Form) -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title" id="modalTitle">Yeni Kitap Ekle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="bookForm">
                        <!-- Alert Container -->
                        <div id="formAlertContainer"></div>

                        <div class="mb-3">
                            <label for="title" class="form-label">Kitap Adı *</label>
                            <input type="text" class="form-control" id="title" name="title" placeholder="Kitabın adını girin" required>
                            <small class="text-muted">1-150 karakter</small>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="author" class="form-label">Yazar *</label>
                            <input type="text" class="form-control" id="author" name="author" placeholder="Yazarın adını girin" required>
                            <small class="text-muted">1-100 karakter</small>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="genre" class="form-label">Türü *</label>
                                <select class="form-select" id="genre" name="genre" required>
                                    <option value="">Seçiniz...</option>
                                    <option value="Roman">Roman</option>
                                    <option value="Bilim">Bilim</option>
                                    <option value="Kişisel Gelişim">Kişisel Gelişim</option>
                                    <option value="Felsefe">Felsefe</option>
                                    <option value="Tarih">Tarih</option>
                                    <option value="Psikoloji">Psikoloji</option>
                                </select>
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="total_pages" class="form-label">Toplam Sayfa *</label>
                                <input type="number" class="form-control" id="total_pages" name="total_pages" min="1" max="50000" placeholder="Toplam sayfa sayısı" required>
                                <small class="text-muted">1-50000</small>
                                <div class="invalid-feedback"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="read_pages" class="form-label">Okunan Sayfa</label>
                                <input type="number" class="form-control" id="read_pages" name="read_pages" min="0" value="0">
                                <small class="text-muted">0 ile toplam sayfa arasında</small>
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label">Durum</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="Okunacak">Okunacak</option>
                                    <option value="Okunuyor">Okunuyor</option>
                                    <option value="Bitti">Bitti</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="rating" class="form-label">Puan (1-5)</label>
                            <select class="form-select" id="rating" name="rating">
                                <option value="">Puan verilmedi</option>
                                <option value="1">⭐ (1/5)</option>
                                <option value="2">⭐⭐ (2/5)</option>
                                <option value="3">⭐⭐⭐ (3/5)</option>
                                <option value="4">⭐⭐⭐⭐ (4/5)</option>
                                <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label">Not / Alıntı</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Kişisel not veya favori alıntı..." maxlength="1000"></textarea>
                            <small class="text-muted"><span id="noteChars">0</span>/1000</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="submit" form="bookForm" class="btn btn-sage-green">
                        <i class="bi bi-check-lg me-2"></i><span id="submitBtnText">Kaydet</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 2rem;"></i>
                    <h5 class="mt-3">Kitabı silmek istediğinize emin misiniz?</h5>
                    <p class="text-muted">Bu işlem geri alınamaz.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Sil</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Özel JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
