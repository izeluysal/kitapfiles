services:
  kitapfiles:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitapfiles
    ports:
      - "5002:5002"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      DEBUG: ${DEBUG:-False}
      DATABASE_PATH: /app/data/app.db
    volumes:
      - kitapdata:/app/data
      - kitapinstance:/app/instance
    restart: unless-stopped

volumes:
  kitapdata:
  kitapinstance:
